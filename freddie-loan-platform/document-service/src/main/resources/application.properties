spring.application.name=document-service
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/freddie_customer
spring.r2dbc.username=freddie_admin
spring.r2dbc.password=freddie_secret

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/freddie-platform

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

server.port=8084

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info,prometheus
management.tracing.sampling.probability=1.0

logging.level.com.freddieapp.documentservice=INFO

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}

