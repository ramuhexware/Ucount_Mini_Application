server.port=8089
spring.application.name=loan-frontend-service

# PostgreSQL Database 2 Connection: Mortgage Loan Applications & Underwriting (freddie_loans)
spring.datasource.url=jdbc:postgresql://localhost:5432/freddie_loans
spring.datasource.username=freddie_admin
spring.datasource.password=freddie_secret
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=freddie_loans
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Fallback H2 configuration for local unit testing
spring.datasource.continue-on-error=true
