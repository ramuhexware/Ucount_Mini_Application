# --------------------------------------------------------------------------------
# SonarQube Project Configuration for Freddie Mac Home Loan Platform (UCount)
# --------------------------------------------------------------------------------

# Unique Project Identification
sonar.projectKey=freddie-loan-platform
sonar.projectName=Freddie Mac Home Loan Platform (UCount Mini Application)
sonar.projectVersion=1.0.0-SNAPSHOT

# Source & Test Directories
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.libraries=target/dependency/*.jar

# Java 17 Version Standard
sonar.java.source=17
sonar.java.target=17
sonar.sourceEncoding=UTF-8

# Coverage and Test Execution Reports (JaCoCo & JUnit)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=target/surefire-reports

# Exclusions & Inclusion Filters
sonar.exclusions=\
  **/config/**,\
  **/entity/**,\
  **/dto/**,\
  **/enums/**,\
  **/*Application.java,\
  **/Q*.java

sonar.coverage.exclusions=\
  **/config/**,\
  **/entity/**,\
  **/dto/**,\
  **/enums/**,\
  **/*Application.java

# Multi-module Definition
sonar.modules=\
  eureka-server,\
  api-gateway,\
  auth-service,\
  customer-service,\
  loan-origination-service,\
  underwriting-service,\
  document-service,\
  login-frontend-service,\
  loan-frontend-service,\
  rate-calculator-service,\
  notification-service
