# --------------------------------------------------------------------------------
# SonarQube Project Configuration for Freddie Mac Home Loan Platform (UCount)
# --------------------------------------------------------------------------------

# Unique Project Identification
sonar.projectKey=freddie-loan-platform
sonar.projectName=Freddie Mac Home Loan Platform (UCount Mini Application)
sonar.projectVersion=1.0.0-SNAPSHOT

# Java 17 Version Standard
sonar.java.source=17
sonar.java.target=17
sonar.sourceEncoding=UTF-8

# Coverage and Test Execution Reports (JaCoCo & JUnit)
sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=**/target/surefire-reports

# Exclusions & Inclusion Filters
sonar.exclusions=\
  **/config/**,\
  **/model/**,\
  **/enums/**,\
  **/*Application.java

sonar.coverage.exclusions=\
  **/config/**,\
  **/model/**,\
  **/enums/**,\
  **/*Application.java

# 2 Microservices Multi-module Definition
sonar.modules=loan-origination-service,underwriting-service

# loan-origination-service module config
loan-origination-service.sonar.projectKey=freddie-loan-origination-service
loan-origination-service.sonar.projectName=Loan Origination Microservice
loan-origination-service.sonar.sources=src/main/java
loan-origination-service.sonar.java.binaries=target/classes

# underwriting-service module config
underwriting-service.sonar.projectKey=freddie-underwriting-service
underwriting-service.sonar.projectName=Underwriting Microservice
underwriting-service.sonar.sources=src/main/java
underwriting-service.sonar.java.binaries=target/classes
