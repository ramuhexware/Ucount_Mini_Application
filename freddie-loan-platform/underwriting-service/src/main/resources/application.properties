spring.application.name=underwriting-service

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.pool-name=UnderwritingHikariPool

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=freddie_uw

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/freddie-platform

server.port=8083

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info,prometheus
management.tracing.sampling.probability=1.0

resilience4j.circuitbreaker.instances.credit-bureau-api.sliding-window-size=10
resilience4j.circuitbreaker.instances.credit-bureau-api.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.credit-bureau-api.wait-duration-in-open-state=60s

logging.level.com.freddieapp.underwriting=INFO

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}

# Enable Java 21 Virtual Threads (Project Loom)
spring.threads.virtual.enabled=true
